<!doctype html>
<!-- Ad pictures for Facebook / Instagram / WhatsApp, drawn by render.mjs (README.md). ?s=tall is 1080 × 1350,
     ?s=sq 1080 × 1080. Fonts and phone screens come from the site (site/node_modules, site/public/screens). -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Anek; src: url(../../site/node_modules/@fontsource-variable/anek-devanagari/files/anek-devanagari-latin-wght-normal.woff2); font-weight: 100 900; }
@font-face { font-family: Anek; src: url(../../site/node_modules/@fontsource-variable/anek-devanagari/files/anek-devanagari-devanagari-wght-normal.woff2); font-weight: 100 900; unicode-range: U+0900-097F, U+200C-200D, U+25CC; }
@font-face { font-family: Mukta; src: url(../../site/node_modules/@fontsource/mukta/files/mukta-latin-400-normal.woff2); font-weight: 400; }
@font-face { font-family: Mukta; src: url(../../site/node_modules/@fontsource/mukta/files/mukta-latin-600-normal.woff2); font-weight: 600; }
@font-face { font-family: Mukta; src: url(../../site/node_modules/@fontsource/mukta/files/mukta-latin-700-normal.woff2); font-weight: 700; }
:root { --bahi:#6a1f24; --brand:#2a6a6e; --brand-dark:#1d4f52; --soft:#e3efef; --ink:#1f1f1f; --subtle:#55524c; --paper:#faf8f4; }
* { box-sizing: border-box; margin: 0; }
body { width: var(--w); height: var(--h); overflow: hidden; background: var(--paper); font-family: Mukta, sans-serif; color: var(--ink); position: relative; }
.copy { position: absolute; left: 80px; top: 80px; right: 80px; }
.brand { display: flex; align-items: center; gap: 16px; font: 600 38px/1 Anek; letter-spacing: -0.01em; }
.tag { margin-top: 56px; font: 600 36px/1.35 Anek; color: var(--bahi); }
h1 { margin-top: 10px; font: 700 104px/0.98 Anek; letter-spacing: -0.025em; }
.lead { margin-top: 28px; font: 400 34px/1.4 Mukta; color: var(--subtle); max-width: 640px; }
.loop { margin-top: 36px; display: inline-flex; gap: 6px; padding: 7px; border-radius: 999px; background: #fff; border: 1px solid #e4ded3; font: 600 25px/1 Mukta; color: var(--subtle); }
.loop span { padding: 12px 20px; border-radius: 999px; }
.loop .on { background: var(--brand); color: #fff; }
.stage { position: absolute; border-radius: 56px; background: radial-gradient(60% 50% at 55% 45%, rgb(255 255 255 / .85), transparent 70%), linear-gradient(160deg, #e3efef, #c9dfdf); overflow: hidden; }
.phone { position: absolute; width: 400px; border-radius: 62px; padding: 4px; background: linear-gradient(145deg,#6b6b70,#2c2c2e 30%,#1c1c1e 60%,#4a4a4e); box-shadow: inset 0 0 0 1px rgb(255 255 255/.12), 0 3px 6px rgb(31 31 31/.12), 0 40px 70px -30px rgb(31 31 31/.45); }
.bezel { border-radius: 58px; background: #0d0d0e; padding: 10px; }
.screen { position: relative; border-radius: 48px; overflow: hidden; background: #fff; }
.status { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0; font: 600 16px Mukta; }
.island { position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 104px; height: 28px; border-radius: 99px; background: #0d0d0e; }
.screen img { display: block; width: 100%; }
.card { position: absolute; display: flex; align-items: center; gap: 18px; background: #fff; border-radius: 26px; padding: 16px 30px 16px 16px; box-shadow: 0 2px 4px rgb(31 31 31/.08), 0 30px 50px -20px rgb(31 31 31/.4); white-space: nowrap; }
.card .ic { width: 64px; height: 64px; border-radius: 18px; background: var(--soft); color: var(--brand-dark); display: grid; place-items: center; }
.card small { display: block; font: 400 22px/1.2 Mukta; color: var(--subtle); }
.card b { display: block; font: 700 34px/1.2 Mukta; }
.cta { position: absolute; display: flex; align-items: center; gap: 20px; }
.btn { display: inline-flex; align-items: center; gap: 14px; background: var(--brand); color: #fff; border-radius: 22px; padding: 22px 34px; font: 600 32px/1 Mukta; box-shadow: 0 14px 30px -14px rgb(42 106 110/.7); }
.url { font: 600 28px/1.3 Mukta; color: var(--subtle); }
.url b { display: block; color: var(--ink); font-weight: 700; }

/* 4:5 feed */
.tall { --w: 1080px; --h: 1350px; }
.tall .cta { left: 80px; top: 650px; }
.tall .stage { left: 60px; right: 60px; top: 820px; bottom: -80px; overflow: visible; }
.tall .p1 { left: 110px; top: 110px; transform: rotate(-7deg); width: 380px; }
.tall .p2 { left: 460px; top: 60px; }
.tall .card { left: 40px; top: 300px; }
/* 1:1 feed */
.sq { --w: 1080px; --h: 1080px; }
.sq h1 { font-size: 80px; }
.sq .copy { right: 500px; }
.sq .lead { font-size: 30px; }
.sq .tag { margin-top: 48px; font-size: 32px; }
.sq .stage { left: 590px; right: 50px; top: 50px; bottom: 50px; overflow: visible; }
.sq .p2 { left: 25px; top: 150px; }
.sq .card { left: -90px; top: 640px; }
.sq .cta { left: 80px; bottom: 80px; flex-direction: column; align-items: flex-start; gap: 22px; }
</style></head>
<body>
<div class="copy">
  <div class="brand"><svg viewBox="0 0 64 64" width="56" height="56"><rect width="64" height="64" rx="14" fill="#6a1f24"/><path d="M14 46V22l18-10 18 10v24M24 46V32h16v14" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg>NirmanKhata</div>
  <p class="tag" lang="ne">ठेकेदारको हिसाब किताब</p>
  <h1>Site and office<br>in one khata</h1>
  <p class="lead">Order slips, deliveries, bills, payments and baki for every project, on your phone.</p>
</div>
<div class="stage">
  <div class="phone p1 only-tall"><div class="bezel"><div class="screen"><div class="status"><span>10:24</span><span class="island"></span><span style="display:flex;gap:6px;align-items:center"><svg width="20" height="13" viewBox="0 0 15 10"><rect x="0" y="7" width="2.5" height="3" rx=".6"/><rect x="4" y="5" width="2.5" height="5" rx=".6"/><rect x="8" y="2.5" width="2.5" height="7.5" rx=".6"/><rect x="12" y="0" width="2.5" height="10" rx=".6"/></svg><svg width="30" height="14" viewBox="0 0 22 10"><rect x=".5" y=".5" width="18" height="9" rx="2.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="12" height="6" rx="1.4"/></svg></span></div><img src="../../site/public/screens/delivery.webp"></div></div></div>
  <div class="phone p2"><div class="bezel"><div class="screen"><div class="status"><span>10:24</span><span class="island"></span><span style="display:flex;gap:6px;align-items:center"><svg width="20" height="13" viewBox="0 0 15 10"><rect x="0" y="7" width="2.5" height="3" rx=".6"/><rect x="4" y="5" width="2.5" height="5" rx=".6"/><rect x="8" y="2.5" width="2.5" height="7.5" rx=".6"/><rect x="12" y="0" width="2.5" height="10" rx=".6"/></svg><svg width="30" height="14" viewBox="0 0 22 10"><rect x=".5" y=".5" width="18" height="9" rx="2.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="12" height="6" rx="1.4"/></svg></span></div><img src="../../site/public/screens/khata.webp"></div></div></div>
  <div class="card"><span class="ic"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span><span><small>Baki, Narayani Cement</small><b>Rs. 3,58,795</b></span></div>
</div>
<div class="cta">
  <span class="btn"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>Book a demo on WhatsApp</span>
  <span class="url"><b>+977 9714509893</b>nirman-khata.com</span>
</div>
<script>document.body.className = new URLSearchParams(location.search).get('s') || 'tall'; if (document.body.className === 'sq') document.querySelectorAll('.only-tall').forEach((e) => e.remove())</script>
</body></html>
