name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            app/pnpm-lock.yaml

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir app install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare

      - name: Point the app at local Supabase
        run: |
          KEY=$(pnpm exec supabase status -o json | jq -r .PUBLISHABLE_KEY)
          printf 'VITE_SUPABASE_URL=http://127.0.0.1:55321\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\nVITE_EMAIL_RESET=true\n' "$KEY" > app/.env.local

      - name: Database tests (RLS, isolation, ledger invariants)
        run: pnpm exec supabase test db

      - name: Concurrency tests (two connections)
        run: bash supabase/tests/concurrency.sh

      - name: File tests (files function, presigned links, permissions)
        run: bash supabase/tests/files.sh

      - name: Export tests (full company export)
        run: bash supabase/tests/export.sh

      - name: App unit tests
        run: pnpm --dir app test

      - name: Typecheck and build
        run: pnpm --dir app build

      # Against the build from the step above, not the dev server: on a cold runner the dev server
      # compiles each page on first visit, which outran the tests' waits. Port 5173 is where auth
      # emails (password reset) redirect.
      - name: End-to-end (phone screen)
        run: |
          pnpm --dir app exec playwright install --with-deps chromium
          pnpm --dir app exec vite preview --port 5173 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:5173 >/dev/null && break; sleep 1; done
          E2E_BASE_URL=http://localhost:5173 pnpm --dir app e2e

  deploy:
    needs: test
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            app/pnpm-lock.yaml

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir app install --frozen-lockfile

      # Photos live in Cloudflare R2. The bucket and its CORS policy are created here; the S3 key
      # pair (R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY) comes from an R2 API token in the dashboard.
      - name: Check R2 secrets
        run: |
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || { echo "::error::GitHub secret $name is not set"; exit 1; }
          done
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: R2 bucket and CORS
        run: |
          npx wrangler r2 bucket create nirman-khata-files --location apac 2>&1 | tee /tmp/r2.log || grep -qi 'already exists' /tmp/r2.log
          npx wrangler r2 bucket cors set nirman-khata-files --file cloudflare/r2-cors.json --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Edge Function secrets (R2)
        run: |
          pnpm exec supabase secrets set --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            FILES_BUCKET=nirman-khata-files \
            FILES_S3_ENDPOINT=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            FILES_S3_REGION=auto \
            FILES_S3_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }} \
            FILES_S3_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        run: pnpm exec supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: |
          pnpm exec supabase functions deploy register --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          pnpm exec supabase functions deploy admin-users --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          pnpm exec supabase functions deploy company-export --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          pnpm exec supabase functions deploy files --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build frontend
        run: pnpm --dir app build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_EMAIL_RESET: 'false'

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages project create nirman-khata --production-branch=master || true
          npx wrangler pages deploy app/dist --project-name nirman-khata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

