# Static PWA: long cache for hashed assets, never cache the shell or service worker.
# Caching uses `expires` (not add_header) so the server-level security headers
# below apply to every response; any add_header inside a location would drop them.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build output: safe to cache for a year.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # nginx's default mime.types has no entry for .webmanifest; Android needs it to offer install.
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    expires -1;
  }

  # Must always be fresh so users get updates.
  location ~ ^/(sw\.js|workbox-.*\.js|index\.html)$ {
    expires -1;
    try_files $uri =404;
  }

  # Client-side routes (/projects/123) fall back to the app shell.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
