<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Construction site and cost register" />
    <title>NirmanKhata</title>
    <!-- The app is behind sign-in; search engines index the marketing site at "/" (site/). -->
    <meta name="robots" content="noindex" />
    <!-- Paint in the company's accent before the app starts (cached by src/lib/accents.ts). -->
    <script>
      try {
        var v = JSON.parse(localStorage.getItem('nk.accent') || '[]')
        for (var i = 0; i < v.length; i++) {
          if (/^[a-z-]+$/.test(v[i][0]) && /^#[0-9a-f]{6}$/.test(v[i][1])) {
            document.documentElement.style.setProperty('--color-' + v[i][0], v[i][1])
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
